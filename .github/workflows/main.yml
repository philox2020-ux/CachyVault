name: Cross-Platform Production Multi-Compiler Build

on:
  push:
    branches:
      - main

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
    - name: Checkout Code Repository Source
      uses: actions/checkout@v4
    - name: Set Up Python Runtime Environment
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - name: Install Critical Software Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install cryptography pyinstaller
    - name: Trigger PyInstaller Native Cross-Compilation Build
      run: |
        python -m PyInstaller --onefile --collect-all tkinterdnd2 --name=CachyVault app.py
    - name: Upload Finished Compiled EXE to GitHub Release Assets Locker
      uses: actions/upload-artifact@v4
      with:
        name: CachyVault-Windows-EXE
        path: dist/CachyVault.exe

  build-linux-appimage:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code Repository Source
      uses: actions/checkout@v4
    - name: Set Up Python Runtime Environment
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - name: Install Linux Compiler Modules
      run: |
        python -m pip install --upgrade pip
        pip install cryptography pyinstaller
    - name: Bundle Standalone Linux App Pack
      run: |
        python -m PyInstaller --onefile --name=CachyVault app.py
    - name: Upload Finished Universal Linux Application Binary
      uses: actions/upload-artifact@v4
      with:
        name: CachyVault-Universal-Linux-Binary
        path: dist/CachyVault

  build-android-apk:
    runs-on: ubuntu-latest  # 🚀 MOBILE COMPILER ENGINE: Fire up a heavy mobile compiler machine
    steps:
    - name: Checkout Code Repository Source
      uses: actions/checkout@v4
    - name: Set Up Python Runtime Environment
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    - name: Build Android APK Package via Buildozer Action Hook
      uses: ArtemGovorov/buildozer-action@v1
      with:
        command: buildozer android debug
        repository_root: .
